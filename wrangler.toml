name = "finish-the-word"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Static client. The Worker only runs for requests that do not match a file
# (/api/health, /api/room/<CODE>); public/.assetsignore keeps dev pages out of deploys.
[assets]
directory = "./public"
binding = "ASSETS"

# One Durable Object per room code.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# SQLite-backed classes are required on the Workers free plan (no storage is used).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Leaderboard", "Matchmaker"]

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Accounts"]

[[durable_objects.bindings]]
name = "ANNOUNCEMENTS"
class_name = "Announcements"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Announcements"]
